<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>许晴我爱你</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        canvas { display: block; }
        .tip { position: absolute; bottom: 10px; width: 100%; text-align: center; color: #ff69b4; font-family: sans-serif; font-size: 12px; opacity: 0.7; pointer-events: none; }
    </style>
</head>
<body>
    <div class="tip">鼠标拖动可以旋转查看 3D 效果</div>
    
    <!-- 引入 Three.js 3D 引擎 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script>
        // 1. 基础场景设置
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000); // 纯黑背景

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 8);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 2. 生成爱心形状的 3D 粒子
        const heartParticles = [];
        const heartCount = 2000; // 爱心粒子数量
        const heartScale = 0.15;
        
        for (let i = 0; i < heartCount; i++) {
            // 使用参数方程生成心形坐标
            const t = Math.random() * Math.PI * 2;
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
            
            // 让心形立体起来（产生 Z 轴厚度）
            const z = (Math.random() - 0.5) * 3; 

            heartParticles.push({
                x: x * heartScale,
                y: -y * heartScale, // Y 轴翻转
                z: z,
                baseX: x, // 存储原始值，用于动画
                baseY: -y,
                baseZ: z,
                color: new THREE.Color(0xff69b4), // 粉色
                size: Math.random() * 0.08 + 0.02
            });
        }

        // 3. 生成文字“许晴我爱你”的粒子
        const textParticles = [];
        const offCanvas = document.createElement('canvas');
        const offCtx = offCanvas.getContext('2d');
        offCanvas.width = 800;
        offCanvas.height = 200;
        
        offCtx.fillStyle = '#ff69b4'; // 粉色文字
        offCtx.font = 'bold 80px "Microsoft YaHei", sans-serif';
        offCtx.textAlign = 'center';
        offCtx.textBaseline = 'middle';
        offCtx.fillText('许晴我爱你', offCanvas.width / 2, offCanvas.height / 2);

        const textData = offCtx.getImageData(0, 0, offCanvas.width, offCanvas.height).data;
        const textScale = 0.01;
        const step = 3; // 采样步长

        for (let y = 0; y < offCanvas.height; y += step) {
            for (let x = 0; x < offCanvas.width; x += step) {
                const index = (y * offCanvas.width + x) * 4;
                const alpha = textData[index + 3];
                if (alpha > 128) {
                    // 将 2D 文字像素映射到 3D 空间
                    const px = (x - offCanvas.width / 2) * textScale;
                    const py = -(y - offCanvas.height / 2) * textScale; 
                    // 放在爱心下方
                    const pz = (Math.random() - 0.5) * 0.5;

                    textParticles.push({
                        x: px,
                        y: py - 2.5, // 向下偏移
                        z: pz,
                        baseX: px,
                        baseY: py - 2.5,
                        baseZ: pz,
                        color: new THREE.Color(0xff69b4),
                        size: Math.random() * 0.1 + 0.02
                    });
                }
            }
        }

        // 4. 合并粒子并创建 Points 对象
        const allParticles = [...heartParticles, ...textParticles];
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(allParticles.length * 3);
        const colors = new Float32Array(allParticles.length * 3);

        allParticles.forEach((p, i) => {
            positions[i * 3] = p.x;
            positions[i * 3 + 1] = p.y;
            positions[i * 3 + 2] = p.z;

            // 颜色加上随机闪烁因子（通过 vertexColors 或随时间更新来实现）
            // 为了简化，这里统一写入粉色，在动画中控制大小和透明度
            colors[i * 3] = p.color.r;
            colors[i * 3 + 1] = p.color.g;
            colors[i * 3 + 2] = p.color.b;
        });

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const material = new THREE.PointsMaterial({
            size: 0.05,
            vertexColors: true,
            transparent: true,
            opacity: 0.9,
            blending: THREE.AdditiveBlending, // 叠加混合，产生发光效果
            depthWrite: false
        });

        const particleSystem = new THREE.Points(geometry, material);
        scene.add(particleSystem);

        // 5. 创建背景闪烁粒子 (空间分布的小粉色点)
        const bgParticleCount = 800;
        const bgGeometry = new THREE.BufferGeometry();
        const bgPositions = new Float32Array(bgParticleCount * 3);
        for(let i=0; i<bgParticleCount * 3; i+=3) {
            bgPositions[i] = (Math.random() - 0.5) * 20;
            bgPositions[i+1] = (Math.random() - 0.5) * 15;
            bgPositions[i+2] = (Math.random() - 0.5) * 10 - 5;
        }
        bgGeometry.setAttribute('position', new THREE.BufferAttribute(bgPositions, 3));
        
        const bgMaterial = new THREE.PointsMaterial({
            size: 0.03,
            color: 0xff69b4,
            transparent: true,
            opacity: 0.5,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });
        const bgParticles = new THREE.Points(bgGeometry, bgMaterial);
        scene.add(bgParticles);

        // 6. 鼠标交互
        let mouseX = 0, mouseY = 0;
        document.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth) * 2 - 1;
            mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
        });

        // 7. 动画循环
        let time = 0;
        function animate() {
            requestAnimationFrame(animate);
            time += 0.05;

            // 让整个场景轻轻旋转，增强 3D 感
            particleSystem.rotation.y += 0.002;
            bgParticles.rotation.y += 0.0005;

            // 闪烁效果：改变粒子大小和透明度
            const scale = 1 + Math.sin(time) * 0.2;
            material.size = 0.05 * scale;
            material.opacity = 0.7 + Math.sin(time * 2) * 0.3; // 整体闪烁

            // 爱心和文字稍微呼吸（可选的微妙效果）
            // 此处可以保留 rotation 让它们一直转

            // 相机跟随鼠标
            camera.position.x += (mouseX * 2 - camera.position.x) * 0.05;
            camera.position.y += (mouseY * 2 - camera.position.y) * 0.05;
            camera.lookAt(0, -1, 0); // 看向爱心和文字的中心

            renderer.render(scene, camera);
        }

        animate();

        // 处理窗口缩放
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
