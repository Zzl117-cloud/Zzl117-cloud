<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>许晴我爱你</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        canvas { display: block; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        // 调整画布大小
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // 粒子类
        class Particle {
            constructor(x, y, targetX, targetY, color) {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = (Math.random() - 0.5) * 2;
                this.targetX = targetX;
                this.targetY = targetY;
                this.color = color;
                this.size = Math.random() * 2 + 1;
                this.delay = Math.random() * 50; // 随机延迟，让流动更自然
            }

            update() {
                if (this.delay > 0) {
                    this.delay--;
                    return;
                }
                // 向目标位置流动
                let dx = this.targetX - this.x;
                let dy = this.targetY - this.y;
                
                // 添加流动的噪声（让颗粒有呼吸和流动感）
                let noiseX = Math.sin(Date.now() * 0.002 + this.targetX) * 2;
                let noiseY = Math.cos(Date.now() * 0.002 + this.targetY) * 2;

                this.vx += dx * 0.005 + noiseX * 0.05;
                this.vy += dy * 0.005 + noiseY * 0.05;
                
                // 摩擦力，防止速度过快
                this.vx *= 0.92;
                this.vy *= 0.92;
                
                this.x += this.vx;
                this.y += this.vy;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.closePath();
            }
        }

        // 获取目标位置
        function getTargets() {
            const targets = [];

            // 1. 生成爱心形状的目标点
            const heartScale = Math.min(width, height) / 35;
            const heartCenterX = width / 2;
            const heartCenterY = height / 2 - 30;
            
            // 爱心参数方程
            for (let t = 0; t < Math.PI * 2; t += 0.1) {
                let x = 16 * Math.pow(Math.sin(t), 3);
                let y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
                
                targets.push({
                    x: heartCenterX + x * heartScale,
                    y: heartCenterY + y * heartScale,
                    color: `rgba(255, 50, 100, ${Math.random() * 0.5 + 0.5})` // 粉红色系
                });
            }

            // 2. 生成文字“许晴我爱你”的目标点
            // 使用离屏 Canvas 获取文字像素坐标
            const offCanvas = document.createElement('canvas');
            const offCtx = offCanvas.getContext('2d');
            offCanvas.width = width;
            offCanvas.height = height;
            
            offCtx.fillStyle = 'white';
            offCtx.font = 'bold 60px "Microsoft YaHei", Arial, sans-serif';
            offCtx.textAlign = 'center';
            offCtx.textBaseline = 'middle';
            offCtx.fillText('许晴我爱你', width / 2, heartCenterY + heartScale * 15); // 放在爱心下面一点

            // 提取像素数据
            const textData = offCtx.getImageData(0, 0, width, height).data;
            const step = 4; // 采样步长，越小粒子越多
            for (let y = 0; y < height; y += step) {
                for (let x = 0; x < width; x += step) {
                    const index = (y * width + x) * 4;
                    const alpha = textData[index + 3];
                    if (alpha > 128) {
                        // 文字粒子的颜色：偏纯白或淡粉
                        targets.push({
                            x: x,
                            y: y,
                            color: `rgba(255, 255, 255, ${Math.random() * 0.8 + 0.2})`
                        });
                    }
                }
            }

            return targets;
        }

        // 初始化
        const targets = getTargets();
        const particles = [];
        // 控制粒子总数，防止卡顿，通常 4000-6000 即可
        const particleCount = Math.min(targets.length, 5000); 

        for (let i = 0; i < particleCount; i++) {
            const target = targets[i % targets.length];
            particles.push(new Particle(target.x, target.y, target.x, target.y, target.color));
        }

        // 动画循环
        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.2)'; // 尾迹效果
            ctx.fillRect(0, 0, width, height);

            particles.forEach(p => {
                p.update();
                p.draw();
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
